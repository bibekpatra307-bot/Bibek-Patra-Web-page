<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Bibek Patra | Creator Portfolio</title>
    <!-- Google Fonts + Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #ededf5;
            scroll-behavior: smooth;
        }
        /* dark theme variables */
        :root {
            --bg: #0a0a0f;
            --card-bg: #14141f;
            --border: #2a2a3a;
            --accent: #4f7df3;
            --accent-glow: #8b5cf6;
            --text: #f0f0f8;
            --text-muted: #a0a0b8;
        }
        .container { max-width: 1600px; margin: 0 auto; padding: 0 24px; }
        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 32px;
            border-bottom: 1px solid var(--border);
            background: rgba(10,10,15,0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #4f7df3, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .admin-login-btn {
            background: #1e1e2e;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        .admin-login-btn:hover { background: var(--accent); border-color: var(--accent); color: white; }
        /* horizontal slider rows */
        .row-section {
            margin: 60px 0 40px;
        }
        .row-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 20px;
            padding-left: 24px;
            border-left: 5px solid var(--accent);
        }
        .slider-wrapper {
            position: relative;
            overflow-x: hidden;
            width: 100%;
            mask-image: linear-gradient(to right, transparent 0%, black 5%, black 95%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 5%, black 95%, transparent 100%);
        }
        .slider-track {
            display: flex;
            gap: 24px;
            width: max-content;
            animation: scrollLeft 40s linear infinite;
        }
        .slider-track:hover { animation-play-state: paused; }
        @keyframes scrollLeft {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .card {
            width: 280px;
            flex-shrink: 0;
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: 0.25s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .card:hover { transform: translateY(-6px); border-color: var(--accent); box-shadow: 0 20px 30px -12px rgba(79,125,243,0.2); }
        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #1a1a2a;
        }
        .card-content { padding: 16px; }
        .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
        .card-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-btn {
            display: inline-block;
            background: var(--accent);
            padding: 6px 16px;
            border-radius: 30px;
            color: white;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
        }
        /* admin dashboard overlay */
        .admin-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            padding: 30px 20px;
        }
        .admin-overlay.active { display: flex; }
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            background: #111118;
            border-radius: 32px;
            padding: 30px;
            border: 1px solid #2a2a3a;
        }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .form-card { background: #1e1e2a; padding: 20px; border-radius: 24px; margin-bottom: 30px; }
        input, textarea, select { background: #0a0a0f; border: 1px solid #2a2a3a; padding: 10px 14px; border-radius: 20px; color: white; width: 100%; margin-bottom: 12px; }
        .btn { background: #4f7df3; border: none; padding: 8px 20px; border-radius: 40px; color: white; cursor: pointer; font-weight: 500; }
        .btn-danger { background: #dc2626; }
        .btn-outline { background: transparent; border: 1px solid #4f7df3; }
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 20px; margin-top: 20px; }
        .admin-card { background: #0f0f17; border-radius: 20px; padding: 12px; display: flex; gap: 12px; align-items: center; }
        .admin-card img { width: 60px; height: 60px; object-fit: cover; border-radius: 12px; }
        .admin-actions button { margin: 0 4px; padding: 4px 12px; font-size: 12px; }
        .tab-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: #1e1e2e; border: none; padding: 8px 20px; border-radius: 40px; cursor: pointer; }
        .tab-btn.active { background: var(--accent); color: white; }
        .category-panel { display: none; }
        .category-panel.active-panel { display: block; }
        footer { text-align: center; padding: 40px 0; border-top: 1px solid #2a2a3a; margin-top: 40px; color: #6a6a7a; }
        @media (max-width: 720px) { .card { width: 240px; } .row-title { font-size: 1.4rem; } }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">Bibek<span style="color:#4f7df3;">.</span>Patra</div>
    <button class="admin-login-btn" id="adminLoginBtn"><i class="fas fa-lock"></i> Admin Login</button>
</div>

<main id="publicContent">
    <div class="container">
        <!-- 6 dynamic rows will be injected here via JS -->
        <div id="rowsContainer"></div>
    </div>
    <footer>© 2026 Bibek Patra — Creator & Technologist | All creations live</footer>
</main>

<!-- Admin Dashboard Overlay -->
<div id="adminOverlay" class="admin-overlay">
    <div class="admin-container">
        <div class="admin-header">
            <h2><i class="fas fa-crown"></i> Admin Dashboard</h2>
            <div><button class="btn-outline" id="logoutAdminBtn">Logout</button> <button class="btn-danger" id="closeAdminBtn">Close</button></div>
        </div>
        <div class="tab-buttons" id="categoryTabs"></div>
        <div id="dynamicPanels"></div>
    </div>
</div>

<!-- Firebase SDKs -->
<script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
            "firebase/storage": "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js"
        }
    }
</script>

<script type="module">
    import { initializeApp } from "firebase/app";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "firebase/auth";
    import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, query, orderBy } from "firebase/firestore";
    import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "firebase/storage";

    const firebaseConfig = {
        apiKey: "AIzaSyB16iYSnLIi95GOuLKnhwHosZZozmKGCAA",
        authDomain: "bibek-patra-web-page.firebaseapp.com",
        projectId: "bibek-patra-web-page",
        storageBucket: "bibek-patra-web-page.firebasestorage.app",
        messagingSenderId: "814616985051",
        appId: "1:814616985051:web:713590937c3be5e5813bfe"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // Categories and collections mapping
    const categories = [
        { id: "books", label: "📚 My Books", collection: "books", fields: ["title","description","link","image"] },
        { id: "aiProjects", label: "🤖 AI Projects", collection: "aiProjects", fields: ["title","description","link","image"] },
        { id: "websites", label: "🌐 My Websites", collection: "websites", fields: ["title","description","link","image"] },
        { id: "utilityTools", label: "🛠️ DP & Utility Tools", collection: "utilityTools", fields: ["title","description","link","image"] },
        { id: "socialMedia", label: "📱 My Social Media", collection: "socialMedia", fields: ["title","description","link","image"] },
        { id: "birthday", label: "🎂 Birthday Special", collection: "birthdayWebsites", fields: ["title","description","link","image"] }
    ];

    // ========== RENDER INFINITE SLIDERS ON PUBLIC PAGE ==========
    async function renderPublicRows() {
        const container = document.getElementById('rowsContainer');
        let html = '';
        for (const cat of categories) {
            const q = query(collection(db, cat.collection), orderBy("createdAt", "desc"));
            const snapshot = await getDocs(q);
            let items = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            if (items.length === 0) items = []; // empty state will show placeholder
            // build slider with duplicated cards for infinite effect (clone twice)
            let cardsHtml = '';
            const duplicatedItems = [...items, ...items, ...items]; // triple for seamless loop
            duplicatedItems.forEach(item => {
                cardsHtml += `
                    <div class="card">
                        <img class="card-img" src="${item.image || 'https://via.placeholder.com/280x180?text=No+Image'}" alt="${item.title || 'card'}">
                        <div class="card-content">
                            <div class="card-title">${escapeHtml(item.title || 'Untitled')}</div>
                            <div class="card-desc">${escapeHtml(item.description || '')}</div>
                            <a href="${item.link || '#'}" target="_blank" class="card-btn">Open <i class="fas fa-arrow-right"></i></a>
                        </div>
                    </div>
                `;
            });
            if (items.length === 0) cardsHtml = `<div class="card" style="display:flex; align-items:center; justify-content:center;">✨ No items yet. Admin can add.</div>`;
            html += `
                <div class="row-section">
                    <h2 class="row-title">${cat.label}</h2>
                    <div class="slider-wrapper">
                        <div class="slider-track">
                            ${cardsHtml}
                        </div>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
    }

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    // ========== ADMIN PANEL LOGIC ==========
    let currentUser = null;
    const adminOverlay = document.getElementById('adminOverlay');
    const adminLoginBtn = document.getElementById('adminLoginBtn');
    const closeAdminBtn = document.getElementById('closeAdminBtn');
    const logoutBtn = document.getElementById('logoutAdminBtn');

    // Show login popup (simple prompt)
    function showLoginModal() {
        const email = prompt("Admin Email:", "admin@bibek.com");
        if (!email) return;
        const password = prompt("Password:");
        if (!password) return;
        signInWithEmailAndPassword(auth, email, password)
            .then(() => { console.log("Login success"); })
            .catch(err => alert("Login failed: " + err.message));
    }

    adminLoginBtn.onclick = () => { showLoginModal(); };
    closeAdminBtn.onclick = () => { adminOverlay.classList.remove('active'); };
    logoutBtn.onclick = async () => { await signOut(auth); adminOverlay.classList.remove('active'); alert("Logged out"); };

    onAuthStateChanged(auth, (user) => {
        currentUser = user;
        if (user) {
            adminOverlay.classList.add('active');
            buildAdminDashboard();
        } else {
            adminOverlay.classList.remove('active');
        }
    });

    // Helper: upload image to storage and return URL
    async function uploadImage(file, pathPrefix) {
        const ext = file.name.split('.').pop();
        const fileName = Date.now() + '_' + Math.random().toString(36) + '.' + ext;
        const storageRef = ref(storage, `${pathPrefix}/${fileName}`);
        await uploadBytes(storageRef, file);
        return await getDownloadURL(storageRef);
    }

    // Build admin tabs & CRUD panels
    async function buildAdminDashboard() {
        const tabsDiv = document.getElementById('categoryTabs');
        const panelsDiv = document.getElementById('dynamicPanels');
        let tabsHtml = '';
        let panelsHtml = '';
        categories.forEach((cat, idx) => {
            const activeClass = idx === 0 ? 'active' : '';
            tabsHtml += `<button class="tab-btn ${activeClass}" data-cat="${cat.id}">${cat.label}</button>`;
            panelsHtml += `<div class="category-panel ${idx === 0 ? 'active-panel' : ''}" id="panel-${cat.id}">
                <div class="form-card">
                    <h3>➕ Add New ${cat.label}</h3>
                    <input type="text" id="${cat.id}_title" placeholder="Title">
                    <textarea id="${cat.id}_desc" placeholder="Short description" rows="2"></textarea>
                    <input type="url" id="${cat.id}_link" placeholder="Website / Link URL">
                    <input type="file" id="${cat.id}_file" accept="image/*">
                    <button class="btn" id="addBtn_${cat.id}">Add Item</button>
                </div>
                <div id="list_${cat.id}" class="items-grid">Loading...</div>
            </div>`;
        });
        tabsDiv.innerHTML = tabsHtml;
        panelsDiv.innerHTML = panelsHtml;

        // tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const catId = btn.getAttribute('data-cat');
                document.querySelectorAll('.category-panel').forEach(panel => panel.classList.remove('active-panel'));
                document.getElementById(`panel-${catId}`).classList.add('active-panel');
            });
        });

        // load each category items and attach add/delete/edit
        for (const cat of categories) {
            await loadCategoryItems(cat);
            document.getElementById(`addBtn_${cat.id}`).onclick = async () => {
                const title = document.getElementById(`${cat.id}_title`).value.trim();
                const desc = document.getElementById(`${cat.id}_desc`).value.trim();
                const link = document.getElementById(`${cat.id}_link`).value.trim();
                const fileInput = document.getElementById(`${cat.id}_file`);
                let imageUrl = "";
                if (fileInput.files.length > 0) {
                    imageUrl = await uploadImage(fileInput.files[0], `admin/${cat.collection}`);
                } else {
                    imageUrl = "https://via.placeholder.com/280x180?text=New+Item";
                }
                if (!title) { alert("Title required"); return; }
                await addDoc(collection(db, cat.collection), {
                    title, description: desc, link, image: imageUrl, createdAt: new Date()
                });
                document.getElementById(`${cat.id}_title`).value = '';
                document.getElementById(`${cat.id}_desc`).value = '';
                document.getElementById(`${cat.id}_link`).value = '';
                fileInput.value = '';
                await loadCategoryItems(cat);
                renderPublicRows(); // refresh public view
            };
        }
    }

    async function loadCategoryItems(cat) {
        const container = document.getElementById(`list_${cat.id}`);
        const q = query(collection(db, cat.collection), orderBy("createdAt", "desc"));
        const snap = await getDocs(q);
        if (snap.empty) { container.innerHTML = '<div style="padding:20px">✨ No items. Add one above.</div>'; return; }
        let html = '';
        for (const docSnap of snap.docs) {
            const data = docSnap.data();
            const docId = docSnap.id;
            html += `
                <div class="admin-card" data-id="${docId}">
                    <img src="${data.image || 'https://via.placeholder.com/60'}" style="width:60px;height:60px;object-fit:cover;">
                    <div style="flex:1">
                        <strong>${escapeHtml(data.title)}</strong><br>
                        <small>${escapeHtml(data.description?.substring(0,60))}</small>
                    </div>
                    <div class="admin-actions">
                        <button class="btn edit-item" data-cat="${cat.id}" data-id="${docId}">✏️ Edit</button>
                        <button class="btn-danger delete-item" data-cat="${cat.id}" data-id="${docId}" data-img="${data.image || ''}">🗑️</button>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
        // attach edit
        container.querySelectorAll('.edit-item').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const id = btn.getAttribute('data-id');
                const catId = btn.getAttribute('data-cat');
                const catObj = categories.find(c => c.id === catId);
                const docRef = doc(db, catObj.collection, id);
                const snapDoc = await getDocs(query(collection(db, catObj.collection)));
                const target = snapDoc.docs.find(d => d.id === id);
                if (!target) return;
                const old = target.data();
                const newTitle = prompt("Edit title", old.title);
                if (newTitle === null) return;
                const newDesc = prompt("Edit description", old.description);
                const newLink = prompt("Edit link URL", old.link);
                let newImage = old.image;
                // optional new image upload
                const fileInputEdit = document.createElement('input');
                fileInputEdit.type = 'file';
                fileInputEdit.accept = 'image/*';
                fileInputEdit.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const url = await uploadImage(file, `admin/${catObj.collection}`);
                        newImage = url;
                        await updateDoc(docRef, { title: newTitle, description: newDesc, link: newLink, image: newImage });
                        await loadCategoryItems(catObj);
                        renderPublicRows();
                    } else {
                        await updateDoc(docRef, { title: newTitle, description: newDesc, link: newLink, image: newImage });
                        await loadCategoryItems(catObj);
                        renderPublicRows();
                    }
                };
                if (confirm("Do you want to change the image? Click OK to upload new image, Cancel to keep old.")) {
                    fileInputEdit.click();
                } else {
                    await updateDoc(docRef, { title: newTitle, description: newDesc, link: newLink, image: newImage });
                    await loadCategoryItems(catObj);
                    renderPublicRows();
                }
            });
        });
        // delete
        container.querySelectorAll('.delete-item').forEach(btn => {
            btn.addEventListener('click', async () => {
                const id = btn.getAttribute('data-id');
                const catId = btn.getAttribute('data-cat');
                const imgUrl = btn.getAttribute('data-img');
                const catObj = categories.find(c => c.id === catId);
                if (confirm(`Delete this item?`)) {
                    // optional delete image from storage
                    if (imgUrl && imgUrl.includes('firebasestorage')) {
                        try {
                            const imageRef = ref(storage, imgUrl);
                            await deleteObject(imageRef);
                        } catch(e) { console.warn("image delete fail"); }
                    }
                    await deleteDoc(doc(db, catObj.collection, id));
                    await loadCategoryItems(catObj);
                    renderPublicRows();
                }
            });
        });
    }

    // initial load public data
    renderPublicRows();
    // seed demo data if collections empty (optional but helpful)
    setTimeout(async () => {
        for (const cat of categories) {
            const snap = await getDocs(collection(db, cat.collection));
            if (snap.empty) {
                // add sample demo for each category so public view not empty
                const sampleImg = "https://picsum.photos/280/180?random=" + cat.id;
                await addDoc(collection(db, cat.collection), {
                    title: `Sample ${cat.label}`,
                    description: `This is a demo item. Login as admin to edit or add your own creations.`,
                    link: "#",
                    image: sampleImg,
                    createdAt: new Date()
                });
            }
        }
        renderPublicRows();
    }, 1000);
</script>
</body>
</html>
